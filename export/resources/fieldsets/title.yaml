title: Title
fields:
  -
    handle: title
    field:
      type: group
      display: Title
      border: false
      hide_display: true
      fullscreen: false
      localizable: false
      fields:
        - import: heading
        -
          handle: options
          field:
            mode: toggle
            type: revealer
            display: 'Title options'
            localizable: false
        -
          handle: title_options
          field:
            type: group
            display: 'Title options'
            always_save: true
            localizable: false
            if:
              options: 'equals true'
            fields:
              -
                handle: variant
                field:
                  options:
                    - key: page-title
                      value: 'Page title'
                    - key: component-title
                      value: 'Component titel'
                  default: component
                  type: select
                  display: Variant
                  width: 50
                  localizable: false
